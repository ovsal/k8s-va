---
# Prepare the secondary worker disk for containerd and Longhorn data.
#
# Resulting layout:
#   /dev/sdb (or node_storage_disk) -> /var/lib/containerd
#   /var/lib/containerd/longhorn   -> /var/lib/longhorn (bind mount)
#
# The playbook is intentionally keyed on mount state, not symlinks. Longhorn
# hostPath mounts require /var/lib/longhorn to be a real directory.

- name: Prepare secondary storage disk on worker nodes
  hosts: kube_node
  become: true
  vars:
    storage_disk: "{{ node_storage_disk | default('/dev/sdb') }}"
    storage_fstype: ext4
    temp_mount_point: /mnt/storage
    containerd_dir: /var/lib/containerd
    longhorn_dir: /var/lib/longhorn

  tasks:
    - name: Check storage disk exists
      stat:
        path: "{{ storage_disk }}"
      register: disk_stat

    - name: Fail if storage disk is missing
      fail:
        msg: "Storage disk {{ storage_disk }} not found on {{ inventory_hostname }}"
      when: not disk_stat.stat.exists

    - name: Check if containerd directory is already a mountpoint
      command: mountpoint -q {{ containerd_dir }}
      register: containerd_mountpoint
      changed_when: false
      failed_when: false

    - name: Check existing filesystem type
      command: blkid -s TYPE -o value {{ storage_disk }}
      register: blkid_type
      changed_when: false
      failed_when: false

    - name: Format storage disk as ext4 when empty
      filesystem:
        fstype: "{{ storage_fstype }}"
        dev: "{{ storage_disk }}"
        opts: -L storage
      when: blkid_type.stdout == ""

    - name: Read storage disk UUID
      command: blkid -s UUID -o value {{ storage_disk }}
      register: storage_uuid
      changed_when: false

    - name: Fail if storage disk UUID is unavailable
      fail:
        msg: "Could not read UUID from {{ storage_disk }} on {{ inventory_hostname }}"
      when: storage_uuid.stdout | trim == ""

    - name: Set storage mount source
      set_fact:
        storage_mount_src: "UUID={{ storage_uuid.stdout | trim }}"

    - name: Stat current containerd directory
      stat:
        path: "{{ containerd_dir }}"
      register: containerd_stat

    - name: Stat current Longhorn directory
      stat:
        path: "{{ longhorn_dir }}"
      register: longhorn_stat

    - name: Create temporary mount point
      file:
        path: "{{ temp_mount_point }}"
        state: directory
        mode: '0755'
      when: containerd_mountpoint.rc != 0

    - name: Mount storage disk temporarily for migration
      mount:
        path: "{{ temp_mount_point }}"
        src: "{{ storage_mount_src }}"
        fstype: "{{ storage_fstype }}"
        state: ephemeral
      when: containerd_mountpoint.rc != 0

    - name: Ensure Longhorn target directory exists on storage disk
      file:
        path: "{{ temp_mount_point }}/longhorn"
        state: directory
        mode: '0711'
      when: containerd_mountpoint.rc != 0

    - name: Stop kubelet and containerd for data migration
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - kubelet
        - containerd
      when: containerd_mountpoint.rc != 0

    - name: Sync containerd data to storage disk root
      command: rsync -aHAX --numeric-ids {{ containerd_dir }}/ {{ temp_mount_point }}/
      when:
        - containerd_mountpoint.rc != 0
        - containerd_stat.stat.exists
        - containerd_stat.stat.isdir | default(false)

    - name: Sync Longhorn data to storage disk
      command: rsync -aHAX --numeric-ids {{ longhorn_dir }}/ {{ temp_mount_point }}/longhorn/
      when:
        - containerd_mountpoint.rc != 0
        - longhorn_stat.stat.exists
        - longhorn_stat.stat.isdir | default(false)

    - name: Remove old containerd directory before final mount
      file:
        path: "{{ containerd_dir }}"
        state: absent
      when: containerd_mountpoint.rc != 0

    - name: Create containerd final mount point
      file:
        path: "{{ containerd_dir }}"
        state: directory
        mode: '0711'
      when: containerd_mountpoint.rc != 0

    - name: Unmount temporary storage disk mount
      mount:
        path: "{{ temp_mount_point }}"
        state: unmounted
      when: containerd_mountpoint.rc != 0

    - name: Remove previous containerd fstab entries
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+{{ containerd_dir | regex_escape() }}\s+'
        state: absent

    - name: Mount storage disk as containerd directory
      mount:
        path: "{{ containerd_dir }}"
        src: "{{ storage_mount_src }}"
        fstype: "{{ storage_fstype }}"
        opts: defaults,noatime
        state: mounted

    - name: Ensure Longhorn data directory exists under containerd mount
      file:
        path: "{{ containerd_dir }}/longhorn"
        state: directory
        mode: '0711'

    - name: Remove old Longhorn path before bind mount
      file:
        path: "{{ longhorn_dir }}"
        state: absent
      when: containerd_mountpoint.rc != 0

    - name: Create Longhorn bind mount point
      file:
        path: "{{ longhorn_dir }}"
        state: directory
        mode: '0711'

    - name: Remove previous Longhorn fstab entries
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+{{ longhorn_dir | regex_escape() }}\s+'
        state: absent

    - name: Bind mount Longhorn data directory
      mount:
        path: "{{ longhorn_dir }}"
        src: "{{ containerd_dir }}/longhorn"
        fstype: none
        opts: bind,x-systemd.requires-mounts-for={{ containerd_dir }}
        state: mounted

    - name: Start containerd and kubelet
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - containerd
        - kubelet

    - name: Show disk layout after migration
      command: df -h {{ containerd_dir }} {{ longhorn_dir }} /
      register: df_output
      changed_when: false

    - name: Print disk layout
      debug:
        msg: "{{ df_output.stdout_lines }}"
