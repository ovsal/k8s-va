[defaults]
inventory          = inventory/prod/hosts.yaml
roles_path         = roles:kubespray/roles
collections_path   = /opt/homebrew/lib/python3.14/site-packages/ansible_collections:~/.ansible/collections:/usr/share/ansible/collections
local_tmp          = .ansible/tmp
host_key_checking  = True
stdout_callback    = yaml
callbacks_enabled  = timer, profile_tasks
forks              = 20
become             = true
become_method      = sudo
private_key_file   = ~/.ssh/id_rsa_ansible2
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = .ansible/facts_cache
fact_caching_timeout = 3600

[ssh_connection]
pipelining         = True
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
