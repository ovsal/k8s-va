---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: velero
  namespace: velero
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: velero
  endpoints:
    - port: http-monitoring
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-alerts
  namespace: velero
spec:
  groups:
    - name: velero.backup
      rules:
        - alert: VeleroBackupFailed
          expr: velero_backup_failure_total > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Velero backup {{ $labels.schedule }} failed"
            description: "Velero backup for schedule {{ $labels.schedule }} has failures. Total failures: {{ $value }}"

        - alert: VeleroBackupMissed
          expr: time() - velero_backup_last_successful_timestamp > 25 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup schedule {{ $labels.schedule }} not completed in 25h"
            description: "Last successful backup for {{ $labels.schedule }} was more than 25 hours ago"

        - alert: VeleroBackupPartialFailure
          expr: velero_backup_partial_failure_total > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has partial failures"
            description: "Velero backup for schedule {{ $labels.schedule }} completed with partial failures: {{ $value }}"
