---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-pdb
  namespace: monitoring
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      prometheus: kube-prometheus-stack-prometheus
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  namespace: monitoring
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      alertmanager: kube-prometheus-stack-alertmanager
