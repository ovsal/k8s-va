# OAuth2 client_id / client_secret для Grafana (заполняет vault-bootstrap → KV → ESO).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-vault-oauth
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-vault-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: platform/grafana-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: platform/grafana-oidc
        property: client_secret
