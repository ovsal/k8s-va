# Loki SingleBinary + filesystem (без S3); при росте нагрузки — SimpleScalable + объектное хранилище.

deploymentMode: SingleBinary

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  nodeSelector:
    storage.enabled: "true"
  persistence:
    enabled: true
    storageClass: longhorn-ha
    size: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false
