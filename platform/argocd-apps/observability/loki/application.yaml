apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/argocd-apps/observability/loki/values.yaml
    - repoURL: https://github.com/ovsal/k8s-va.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # Шаблон PVC в StatefulSet после создания менять нельзя — при смене size в values Argo
  # иначе бессмысленно гоняется с live-объектом. Реальное расширение диска — patch PVC (см. docs/observability.md).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
