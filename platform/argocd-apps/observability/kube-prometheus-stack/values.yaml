# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics, правила.
# Grafana: вход через форму логина; учётка admin из Secret grafana-admin-credentials (см. make grafana-admin-secret).

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

prometheusOperator:
  nodeSelector:
    storage.enabled: "true"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  nodeSelector:
    storage.enabled: "true"

prometheus-node-exporter:
  tolerations:
    - effect: NoSchedule
      operator: Exists

prometheus:
  prometheusSpec:
    nodeSelector:
      storage.enabled: "true"
    retention: 15d
    scrapeInterval: 30s
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ha
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      storage.enabled: "true"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ha
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    storage.enabled: "true"
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn-ha
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.k8s.va.atmodev.net
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # OAuth state / заголовки; малый буфер иногда даёт 502 на callback.
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.k8s.va.atmodev.net
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000
  env:
    GF_SERVER_ROOT_URL: https://grafana.k8s.va.atmodev.net
  grafana.ini:
    server:
      root_url: https://grafana.k8s.va.atmodev.net/
      domain: grafana.k8s.va.atmodev.net
    security:
      cookie_secure: true
      # В YAML без кавычек «none» может стать null (YAML 1.1).
      cookie_samesite: "none"
    users:
      allow_sign_up: false
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
