apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-external-secrets-samples
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/ovsal/k8s-va.git
    targetRevision: main
    path: platform/argocd-apps/secrets/external-secrets-samples
    directory:
      recurse: false
      include: 'argocd-example.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

