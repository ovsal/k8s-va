apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-crds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-crds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-crds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-crds
subjects:
  - kind: ServiceAccount
    name: external-secrets-crds
    namespace: external-secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-crds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: external-secrets-crds
      restartPolicy: OnFailure
      nodeSelector:
        storage.enabled: "true"
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.34.3
          command:
            - sh
            - -lc
            - |
              set -euo pipefail
              echo "Applying External Secrets CRDs (server-side)..."
              kubectl apply --server-side --force-conflicts -f \
                "https://raw.githubusercontent.com/external-secrets/external-secrets/v2.4.1/deploy/crds/bundle.yaml"
              echo "Done."

