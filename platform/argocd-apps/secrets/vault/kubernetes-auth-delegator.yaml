# Разрешаем подам Vault (ServiceAccount релиза) вызывать TokenReview API.
# Нужно для настройки auth/kubernetes в Vault (token_reviewer_jwt из SA пода).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-kubernetes-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: secrets-vault
    namespace: vault
