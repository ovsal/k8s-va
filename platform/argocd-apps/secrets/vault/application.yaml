apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.32.0
    helm:
      values: |
        global:
          enabled: true

        server:
          # UI включаем, TLS внутри пода выключаем (TLS терминируется на ingress-nginx)
          # и общение в кластере идёт по HTTP (внутри доверенной сети).
          # При необходимости можно будет включить TLS на listener позже.
          standalone:
            enabled: false

          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "raft" {
                  path = "/vault/data"
                }

                service_registration "kubernetes" {}

          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: longhorn-ha

          # Vault должен работать на worker-нодах.
          nodeSelector:
            storage.enabled: "true"

          # Разносим реплики по разным worker-нодам.
          affinity: |
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vault
                        app.kubernetes.io/instance: secrets-vault
                        component: server
                    topologyKey: kubernetes.io/hostname

          # Включаем disruption budget (по умолчанию в chart он включён в HA).
          # Оставляем дефолтный maxUnavailable, чтобы сохранялся кворум.
          disruptionBudget:
            enabled: true

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        injector:
          enabled: true
          nodeSelector:
            storage.enabled: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

