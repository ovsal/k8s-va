apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-argocd-example
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-argocd-example
    creationPolicy: Owner
  data:
    - secretKey: demo
      remoteRef:
        key: platform/example
        property: demo

