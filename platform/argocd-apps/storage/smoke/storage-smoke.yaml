apiVersion: v1
kind: Namespace
metadata:
  name: storage-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-local
  namespace: storage-smoke
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-local
  namespace: storage-smoke
spec:
  nodeSelector:
    storage.enabled: "true"
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo local-ok > /data/ok.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-longhorn
  namespace: storage-smoke
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-ha
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-longhorn
  namespace: storage-smoke
spec:
  nodeSelector:
    storage.enabled: "true"
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo longhorn-ok > /data/ok.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-longhorn

