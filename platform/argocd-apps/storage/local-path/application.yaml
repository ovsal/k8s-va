apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-local-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.containeroo.ch
    chart: local-path-provisioner
    targetRevision: 0.0.37
    helm:
      values: |
        storageClass:
          create: true
          name: local-storage
          defaultClass: false
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /storage/local
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

