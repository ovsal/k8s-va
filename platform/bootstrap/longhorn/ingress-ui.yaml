apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Доступ только из доверенной подсети (остальные получают 403 до проверки Basic Auth).
    nginx.ingress.kubernetes.io/whitelist-source-range: "176.113.118.0/24,10.0.0.0/8,91.239.85.0/24"
    # Basic Auth поверх Longhorn UI (секрет создаётся скриптом, не хранится в Git).
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: longhorn-ui-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Longhorn UI"
spec:
  tls:
    - hosts:
        - longhorn.k8s.va.atmodev.net
      secretName: longhorn-ui-tls
  rules:
    - host: longhorn.k8s.va.atmodev.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
