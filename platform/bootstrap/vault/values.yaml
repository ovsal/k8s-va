# Значения Helm для Vault (раньше в Argo CD Application secrets-vault).
# Релиз должен называться secrets-vault (имена сервисов secrets-vault-active и т.д.).
global:
  enabled: true

server:
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 2
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://secrets-vault-0.secrets-vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: longhorn-ha

  nodeSelector:
    storage.enabled: "true"

  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                app.kubernetes.io/instance: secrets-vault
                component: server
            topologyKey: kubernetes.io/hostname

  disruptionBudget:
    enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

injector:
  enabled: true
  nodeSelector:
    storage.enabled: "true"
